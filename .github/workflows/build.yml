name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Initialize Project & Install Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Initialize Capacitor Android & Wrap HTML
      run: |
        mkdir -p www
        cp index.html www/
        npx cap init SMSApp com.sms.app --web-dir www
        npx cap add android

    - name: Configure Low-Resource Gradle Build
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
        echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
        echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
        echo "org.gradle.workers.max=1" >> ~/.gradle/gradle.properties

    - name: Fix Permissions
      run: |
        cd android
        chmod +x gradlew

    - name: Build Android APK
      run: |
        cd android
        ./gradlew assembleDebug --max-workers=1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
