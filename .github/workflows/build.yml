name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Initialize Project & Install Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Set up JDK 11 (가장 안정적인 빌드 환경)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Initialize Capacitor Android & Wrap HTML
      run: |
        mkdir -p www
        cp index.html www/
        npx cap init SMSApp com.sms.app --web-dir www
        npx cap add android
        
    - name: Fix Gradle Permissions
      run: |
        cd android
        chmod +x gradlew

    - name: Build Android APK via Gradle (에러 무시하고 강제 빌드)
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
