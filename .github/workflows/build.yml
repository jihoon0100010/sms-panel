name: Build Android APK (Absolute Final)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 17 (안정화 버전 고정)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Stable Capacitor v6 (버전 고정)
      run: |
        npm init -y
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

    - name: Setup Web Directory & Init
      run: |
        mkdir -p www
        cp index.html www/
        npx cap init SMSApp com.sms.app --web-dir www
        npx cap add android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
