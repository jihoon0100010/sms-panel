name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Initialize Project & Install Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Set up JDK 17 (최신 안드로이드 빌드 필수 조건)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Initialize Capacitor Android & Wrap HTML
      run: |
        mkdir -p www
        cp index.html www/
        npx cap init SMSApp com.sms.app --web-dir www
        npx cap add android

    - name: Increase Gradle Memory (빌드 뻗음 방지)
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

    - name: Fix Gradle Permissions
      run: |
        cd android
        chmod +x gradlew

    - name: Build Android APK via Gradle
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
